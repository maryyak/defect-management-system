version: '3.8'

services:
  # Микросервис уведомлений с репликацией
  notification-service:
    image: defect-notification-service:latest
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - NODE_ENV=production
    networks:
      - defect-network

  # Микросервис отчетов с репликацией
  report-service:
    image: defect-report-service:latest
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      - NODE_ENV=production
    networks:
      - defect-network

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-config:/etc/nginx
    depends_on:
      - notification-service
      - report-service
    networks:
      - defect-network
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf

networks:
  defect-network:
    driver: overlay
    attachable: true

volumes:
  nginx-config:
    driver: local

configs:
  nginx_conf:
    file: ./nginx/nginx.conf