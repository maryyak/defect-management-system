services:
  user-service:
    build: ./user-service
    container_name: defect-user-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-jwt-key
      - LOG_LEVEL=info
    networks:
      - defect-network

  defect-service:
    build: ./defect-service
    container_name: defect-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    networks:
      - defect-network

networks:
  defect-network:
    driver: bridge